name: Planejamento hidrotérmico
on:
  push:
    branches: [main]
    paths:
      - '05. PLANEJAMENTO ENERGÉTICO/hidrotermico-streamlit/**'
      - '05. PLANEJAMENTO ENERGÉTICO/exemplo-pysddp-pl-unico/**'
      - '.github/workflows/hidrotermico.yml'
      - '.streamlit/config.toml'
      - 'requirements.txt'
      - 'streamlit_app.py'
  pull_request:
    paths:
      - '05. PLANEJAMENTO ENERGÉTICO/hidrotermico-streamlit/**'
      - '05. PLANEJAMENTO ENERGÉTICO/exemplo-pysddp-pl-unico/**'
      - '.github/workflows/hidrotermico.yml'
      - '.streamlit/config.toml'
      - 'requirements.txt'
      - 'streamlit_app.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: '05. PLANEJAMENTO ENERGÉTICO/hidrotermico-streamlit'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            05. PLANEJAMENTO ENERGÉTICO/hidrotermico-streamlit/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  leitores:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: '05. PLANEJAMENTO ENERGÉTICO/exemplo-pysddp-pl-unico'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '05. PLANEJAMENTO ENERGÉTICO/exemplo-pysddp-pl-unico/requirements.txt'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest test_leitores.py -q
